supported_languages:
  - "en"
  - "es"
recognizers:
  - name: "Chilean RUT Recognizer"
    supported_language: "es"
    supported_entity: "CHILE_RUT"
    patterns:
      - name: "rut"
        regex: '\b(\d{1,2}(?:\.?\d{3}){2}-[\dkK])\b'
        score: 0.8

