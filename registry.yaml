supported_languages:
  - "en"
  - "es"
recognizers:
  - name: "Chilean RUT Recognizer"
    supported_language: "es"
    supported_entity: "CHILE_RUT"
    patterns:
      - name: "rut"
        # Regex ultra flexible para carnets escaneados: 
        # 1. Sin \b (para tolerar si el OCR junta "RUN80.000...")
        # 2. Acepta 'l' o 'I' porque el OCR suele confundir el número 1 del RUT con letras.
        # 3. Acepta comas en vez de puntos.
        regex: '(?<!\d)\d{1,2}(?:\s*[\.,]?\s*\d{3}){2}\s*[-—_]\s*[\dkKlLiI](?!\d)'
        score: 0.8

# =====================================================================
# FASE 2 (OPCIÓN EVOLUTIVA - RECONOCEDORES CUSTOM / DEEP LEARNING)
# =====================================================================
# Si se entrena un modelo NER custom y se monta en Presidio Analyzer,
# se pueden registrar aquí mapeos de entidades adicionales (ej. mapear
# la etiqueta de entidad "DIAG_MED" del modelo a "DATA_SALUD").
