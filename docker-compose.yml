services:
  mysql:
    image: mysql:8.0
    container_name: proyecto-pii-mysql-1
    environment:
      MYSQL_ROOT_PASSWORD: upshield123
      MYSQL_DATABASE: pii_discovery
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pupshield123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  tika:
    image: apache/tika:latest-full
    container_name: proyecto-pii-tika-1
    ports:
      - "9998:9998"
    environment:
      - TIKA_CHILD_JAVA_OPTS=-Xmx2g
    restart: always

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: proyecto-pii-presidio-analyzer-1
    user: root
    ports:
      - "5001:3000"
    volumes:
      - ./analyzer.yaml:/app/analyzer.yaml
      - ./nlp_config.yaml:/app/nlp_config.yaml
      - ./registry.yaml:/app/registry.yaml
    environment:
      - ANALYZER_CONF_FILE=/app/analyzer.yaml
      - NLP_CONF_FILE=/app/nlp_config.yaml
      - RECOGNIZER_REGISTRY_CONF_FILE=/app/registry.yaml
    command: >
      sh -c "python -m spacy download es_core_news_lg && python app.py"
    restart: always

  edge-backend:
    build:
      context: ./edge_backend
      dockerfile: Dockerfile
    container_name: proyecto-pii-edge-backend-1
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      tika:
        condition: service_started
      presidio-analyzer:
        condition: service_started
    env_file:
      - ./edge_backend/.env
    environment:
      - TZ=America/Santiago
      - TIKA_URL=http://tika:9998/tika
      - PRESIDIO_URL=http://presidio-analyzer:3000/analyze
      - PRESIDIO_HEALTH_URL=http://presidio-analyzer:3000/health
      - OMP_THREAD_LIMIT=1
      - OMP_NUM_THREADS=1
      # MySQL dentro de Docker (sobreescribe el .env si DATABASE_URL apunta a MySQL)
      - DATABASE_URL=mysql+pymysql://root:upshield123@mysql:3306/pii_discovery
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./edge_backend:/app
      - ./edge_backend/data:/app/data
      - ./CARPETA_PRUEBA_MASIVA:/app/CARPETA_PRUEBA_MASIVA
      - ./RRHH:/app/RRHH
      - ./Contratos_2025:/app/Contratos_2025
      # Mount de la raíz completa del servidor Linux (Full Access).
      # Esto rompe el aislamiento de Docker y le permite al contenedor ver TODO el
      # servidor Linux. Así, el cliente puede simplemente ir a la página web y escribir 
      # CUALQUIER carpeta (ej. /var/www, /home/archivos, /opt/datos) y funcionará.
      - /:/host_root:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    restart: always

  edge-frontend:
    build:
      context: ./edge_frontend
      dockerfile: Dockerfile
    container_name: proyecto-pii-edge-frontend-1
    ports:
      - "3000:3000"
    depends_on:
      - edge-backend
    restart: always

volumes:
  mysql_data:
    driver: local
